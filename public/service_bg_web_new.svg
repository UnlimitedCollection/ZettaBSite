<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020D1C"/>
      <stop offset="45%" stop-color="#0A2B4D"/>
      <stop offset="100%" stop-color="#041327"/>
    </linearGradient>
    <radialGradient id="washA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1420 180) rotate(121) scale(560 840)">
      <stop stop-color="#24D2FF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#24D2FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="washB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(540 920) rotate(39) scale(700 860)">
      <stop stop-color="#2E7EFF" stop-opacity="0.32"/>
